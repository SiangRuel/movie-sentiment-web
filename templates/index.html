<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Movie Sentiment Analysis System</title>

    <link rel="stylesheet" href="/static/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="main-layout">
      <!-- 左側 -->
      <div class="left-panel">
        <h1>🎬 AI Movie Sentiment Analysis System</h1>

        <div id="trailerArea"></div>
        <div id="result" class="result-card">
          <div class="stats-panel">
            <div id="resultText"></div>
          </div>

          <div class="chart-panel">
            <div class="chart-container">
              <canvas id="chart"></canvas>
            </div>
          </div>
        </div>
      </div>

      <!-- 右側 -->
      <div class="right-panel">
        <!-- 電影資訊 -->
        <div class="card">
          <h3>
            <i class="fa-solid fa-film"></i>
            Movie Search / 電影搜尋
          </h3>

          <div class="search-row">
            <input
              id="movieInput"
              placeholder="Enter movie title... / 輸入電影名稱"
            />
            <button onclick="crawlMovie()">Search / 搜尋</button>
          </div>

          <div id="movieInfo"></div>
        </div>

        <!-- 推薦 + AI摘要 -->
        <div class="dashboard-row">
          <div class="card half-card">
            <h3>
              <i class="fa-solid fa-star"></i>
              Recommendation Score / 推薦指數
            </h3>
            <div id="recommendation"></div>
          </div>

          <div class="card half-card">
            <h3>
              <i class="fa-solid fa-brain"></i>
              AI Summary / AI分析摘要
            </h3>
            <div id="movieSummary"></div>
          </div>
        </div>

        <!-- 📝 評論 -->
        <div class="card">
          <h3>
            <i class="fa-solid fa-comments"></i>
            All Reviews / 全部評論
          </h3>
          <ul id="reviews"></ul>
        </div>

        <div class="dashboard-row">
          <div class="card half-card">
            <h3>
              <i class="fa-solid fa-thumbs-up"></i>
              Top Positive Reviews / 最佳好評
            </h3>
            <div id="topPositive"></div>
          </div>

          <div class="card half-card">
            <h3>
              <i class="fa-solid fa-thumbs-down"></i>
              Top Negative Reviews / 最佳負評
            </h3>
            <div id="topNegative"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="/static/script.js"></script>
  </body>
</html>
